# DataPilot Enterprise Business Glossary
# Defines database-scoped business concepts, preferred schema mappings, and semantic hints.
# Strictly partitioned by database_id to prevent cross-database knowledge leakage.

databases:
  E_commerce:
    definitions:
      - term: revenue
        meaning: "Total monetary value generated from completed product sales"
        preferred_columns:
          - order_items.price
        formula_or_hint: "SUM(order_items.price)"
        synonyms:
          - sales revenue
          - turnover
          - monetary sales
          - total revenue
          - gross revenue
        examples:
          - "What is total revenue by category?"
          - "Show monthly revenue"
        priority: 100
        confidence: 1.0

      - term: sales
        meaning: "Monetary sales amount generated by orders"
        preferred_columns:
          - order_items.price
        formula_or_hint: "SUM(order_items.price)"
        synonyms:
          - total sales
          - sales amount
          - gross sales
        examples:
          - "Show sales by product category"
          - "What are our top products by sales?"
        priority: 95
        confidence: 0.95

      - term: sales_volume
        meaning: "Total quantity or count of individual product items sold"
        preferred_columns:
          - order_items.order_item_id
        formula_or_hint: "COUNT(order_items.order_item_id)"
        synonyms:
          - item volume
          - order item count
          - units sold
          - quantity sold
          - item sales volume
        examples:
          - "What are the top 3 product categories by total item sales volume?"
          - "Rank products by sales volume"
        priority: 100
        confidence: 1.0

      - term: units_sold
        meaning: "Number of units or items purchased across order lines"
        preferred_columns:
          - order_items.order_item_id
        formula_or_hint: "COUNT(order_items.order_item_id)"
        synonyms:
          - total items sold
          - items count
          - product volume
        examples:
          - "How many units were sold last month?"
        priority: 100
        confidence: 1.0

      - term: delivered_order
        meaning: "Orders that reached final delivered status in their fulfillment lifecycle"
        preferred_columns:
          - orders.order_status
        formula_or_hint: "orders.order_status = 'delivered'"
        synonyms:
          - delivered orders
          - fulfilled orders
          - completed delivery
        examples:
          - "Find average freight value for delivered orders"
        priority: 100
        confidence: 1.0

      - term: pending_order
        meaning: "Orders currently in non-terminal processing, created, or invoiced status"
        preferred_columns:
          - orders.order_status
        formula_or_hint: "orders.order_status IN ('processing', 'invoiced', 'created')"
        synonyms:
          - open orders
          - unfulfilled orders
          - in-progress orders
        examples:
          - "Count pending orders"
        priority: 90
        confidence: 0.95

      - term: average_order_value
        meaning: "Average monetary spend per distinct order"
        preferred_columns:
          - order_items.price
          - order_items.order_id
        formula_or_hint: "SUM(order_items.price) / COUNT(DISTINCT order_items.order_id)"
        synonyms:
          - aov
          - avg order value
          - mean order amount
        examples:
          - "Calculate average order value by state"
        priority: 90
        confidence: 0.95

      - term: customer_delivery_date
        meaning: "Timestamp when an order was delivered directly to the end customer"
        preferred_columns:
          - orders.order_delivered_customer_date
        formula_or_hint: "orders.order_delivered_customer_date"
        synonyms:
          - customer received date
          - arrival date
        examples:
          - "When were orders delivered to customers?"
        priority: 95
        confidence: 0.95

      - term: carrier_delivery_date
        meaning: "Timestamp when an order was dispatched or handed off to the logistics carrier"
        preferred_columns:
          - orders.order_delivered_carrier_date
        formula_or_hint: "orders.order_delivered_carrier_date"
        synonyms:
          - carrier dispatch date
          - shipping date
        examples:
          - "When did the carrier deliver the orders?"
        priority: 95
        confidence: 0.95

  AdventureWorks:
    definitions:
      - term: sales_volume
        meaning: "Total count of order quantities across sales line items"
        preferred_columns:
          - salesorderdetail.orderqty
        formula_or_hint: "SUM(salesorderdetail.orderqty)"
        synonyms:
          - quantity ordered
          - order item volume
        examples:
          - "Sales volume by product category"
        priority: 100
        confidence: 1.0

      - term: list_price
        meaning: "Base catalog price for a product before discounts"
        preferred_columns:
          - product.listprice
        formula_or_hint: "product.listprice"
        synonyms:
          - catalog price
          - retail price
          - price
        examples:
          - "Find products with list price greater than 1000"
        priority: 95
        confidence: 0.95

      - term: total_due
        meaning: "Total financial obligation including freight and tax on a sales order"
        preferred_columns:
          - salesorderheader.totaldue
        formula_or_hint: "salesorderheader.totaldue"
        synonyms:
          - order total
          - total due amount
          - invoice total
        examples:
          - "Top 5 sales orders with highest total due amount"
        priority: 100
        confidence: 1.0

  Baseball:
    definitions:
      - term: single_season_wins
        meaning: "Total regular season team victories recorded in a single calendar year"
        preferred_columns:
          - team.w
          - team.year
          - team.name
        formula_or_hint: "team.w"
        synonyms:
          - season wins
          - highest wins
          - team wins
        examples:
          - "Top 5 teams with the highest number of wins in any single season"
        priority: 100
        confidence: 1.0

      - term: player_count
        meaning: "Total unique baseball players registered in player master"
        preferred_columns:
          - player.player_id
        formula_or_hint: "COUNT(*) FROM player"
        synonyms:
          - total players
          - player roster count
        examples:
          - "How many total players are listed in the player table?"
        priority: 100
        confidence: 1.0

  default:
    definitions:
      - term: revenue
        meaning: "Total net monetary collections from successful customer payments"
        preferred_columns:
          - payments.amount
          - payments.payment_status
        formula_or_hint: "SUM(payments.amount)"
        synonyms:
          - total revenue
          - net revenue
          - collected revenue
          - payments revenue
        examples:
          - "What is our total revenue?"
          - "Show monthly revenue from payments"
        priority: 100
        confidence: 1.0

      - term: arr
        meaning: "Total contracted Annual Recurring Revenue for active customer subscriptions"
        preferred_columns:
          - subscriptions.contracted_arr
          - subscriptions.status
        formula_or_hint: "SUM(subscriptions.contracted_arr)"
        synonyms:
          - annual recurring revenue
          - total arr
          - contracted arr
          - active arr
        examples:
          - "What is our total ARR?"
          - "Show active ARR by account segment"
        priority: 100
        confidence: 1.0

      - term: nrr
        meaning: "Proxy Net Revenue Retention percentage comparing active contracted ARR against total contracted ARR (Active ARR / Total ARR * 100). Note: Canonical cohort NRR requires cohort-based starting ARR with expansions and contractions, which is not tracked in this schema."
        preferred_columns:
          - subscriptions.contracted_arr
          - subscriptions.status
          - subscriptions.account_id
        formula_or_hint: "ROUND(SUM(CASE WHEN s.status = 'active' THEN s.contracted_arr ELSE 0 END) * 100.0 / SUM(s.contracted_arr), 2)"
        synonyms:
          - net revenue retention
          - nrr percentage
          - retention rate
          - proxy retention
        examples:
          - "Calculate NRR by customer segment"
          - "Show quarterly net revenue retention"
        priority: 100
        confidence: 1.0

      - term: churn
        meaning: "Cancelled customer subscriptions or customer accounts identified as high churn risk"
        preferred_columns:
          - subscriptions.status
          - accounts.churn_risk
        formula_or_hint: "subscriptions.status = 'cancelled'"
        synonyms:
          - churned subscriptions
          - churn risk
          - cancellations
        examples:
          - "How many subscriptions churned?"
          - "List accounts with high churn risk"
        priority: 95
        confidence: 0.95

      - term: active_customers
        meaning: "Total unique customer accounts with active subscription status"
        preferred_columns:
          - subscriptions.account_id
          - subscriptions.status
        formula_or_hint: "COUNT(DISTINCT subscriptions.account_id)"
        synonyms:
          - active accounts
          - paying customers
          - subscriber count
        examples:
          - "How many active customers do we have?"
          - "Count paying accounts by region"
        priority: 95
        confidence: 0.95

